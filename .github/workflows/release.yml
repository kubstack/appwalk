name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm >= 11.5.1; the bundled version can lag behind.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # npm publish runs "prepublishOnly" (build + test) automatically before publishing.
      # Authenticates via OIDC trusted publishing (configured on npmjs.com) — no token needed.
      - run: npm publish --provenance --access public
